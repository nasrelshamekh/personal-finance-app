services:
  postgres:
    image: postgres:16-alpine
    container_name: ledger-eg-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      # Host 5433, not 5432: a native PostgreSQL service already owns 5432 on this
      # machine and would silently win the connection. Container-side stays standard.
      - '5433:5432'
    volumes:
      - ledger-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ledger -d ledger']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ledger-pgdata:
